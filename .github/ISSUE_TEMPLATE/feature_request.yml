name: 💡 Idea or request
description: Something Waypack should do, or should do differently
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Tell the story rather than the solution. The trip where you needed this, and what you did
        instead, survives far better than a described feature — which often turns out to be the
        wrong shape once someone tries to build it.

  - type: textarea
    id: problem
    attributes:
      label: What went wrong on a real trip
      description: The situation, not the feature.
      placeholder: We were four people sharing a stove and a tent, and I couldn't tell who was carrying what, so two of us packed a stove.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you did instead
      description: Paper, another app, a note, giving up — all of it is information.
    validations:
      required: false

  - type: textarea
    id: idea
    attributes:
      label: What you'd like Waypack to do
      description: If you already have a shape in mind, here's the place.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: The one hard limit
      description: >
        Waypack ships with no INTERNET permission and that is the product, not a stage it will grow
        out of. Anything needing a server, an account or live sync is out of scope for good.
        Handing a trip to another person already works offline through the .waypack file.
      options:
        - label: What I'm asking for doesn't need a server, an account or an internet connection
          required: true
